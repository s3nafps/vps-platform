---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Rate-limit SSH before the default policy changes
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port }}"
    proto: tcp
    comment: ssh

- name: Allow web traffic over TCP
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: web
  loop: "{{ firewall_allowed_tcp }}"

- name: Allow web traffic over UDP
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
    comment: web
  loop: "{{ firewall_allowed_udp }}"

- name: Deny incoming and allow outgoing by default
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Enable the firewall
  community.general.ufw:
    state: enabled
    logging: low
