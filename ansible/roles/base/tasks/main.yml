---
- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ platform_hostname }}"

- name: Set the timezone
  community.general.timezone:
    name: "{{ platform_timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: safe
  register: base_upgrade

- name: Configure unattended security upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"

- name: Enable the periodic apt jobs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Apply kernel network and memory hardening
  ansible.builtin.template:
    src: 60-platform-sysctl.conf.j2
    dest: /etc/sysctl.d/60-platform.conf
    mode: "0644"
  notify: Apply sysctl settings

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Cap the systemd journal size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-platform.conf
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse={{ base_journald_max_use }}
  notify: Restart journald

- name: Create the node-exporter textfile directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    mode: "0755"

- name: Configure the swap file
  ansible.builtin.include_tasks: swap.yml
  when: platform_swap_size_mb | int > 0

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: base_reboot_required

- name: Report a pending reboot
  ansible.builtin.debug:
    msg: >-
      A reboot is pending. Unattended-upgrades will reboot at {{ platform_auto_reboot_time }}
      or run: ansible platform -b -m reboot
  when: base_reboot_required.stat.exists
