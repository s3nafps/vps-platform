groups:
  - name: host
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Node exporter on {{ $labels.instance }} is not responding
          description: Prometheus has not scraped node metrics for 2 minutes.

      - alert: HostHighCpu
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: CPU above 90% on {{ $labels.instance }}
          description: "CPU usage is {{ $value | printf \"%.0f\" }}% for 15 minutes."

      - alert: HostMemoryPressure
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Less than 10% memory available on {{ $labels.instance }}
          description: "Available memory is {{ $value | printf \"%.1f\" }}%."

      - alert: HostDiskSpaceLow
        expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} below 15% free on {{ $labels.instance }}"
          description: "{{ $value | printf \"%.1f\" }}% free."

      - alert: HostDiskSpaceCritical
        expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} below 5% free on {{ $labels.instance }}"
          description: "{{ $value | printf \"%.1f\" }}% free. Services will start failing."

      - alert: HostDiskWillFillIn24Hours
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.4
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 24 hours"
          description: At the current write rate the filesystem runs out of space within a day.

      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Clock on {{ $labels.instance }} is off by more than 50 ms
          description: Check chrony; TLS and log correlation depend on accurate time.

      - alert: HostOomKill
        expr: increase(node_vmstat_oom_kill[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: The kernel killed a process for lack of memory on {{ $labels.instance }}
          description: Check container memory limits and recent deploys.
